<!doctype html><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#fff}iframe{border:0;display:block;margin:0 auto}</style>
<iframe id="f"></iframe>
<script>
  // Captura auxiliar: ?src=pagina&w=1440&h=900&id=seccion&off=40&wa=1 — carga la página en un iframe, la desplaza a la sección y opcionalmente abre WhatsApp
  const q = new URLSearchParams(location.search), f = document.getElementById('f');
  f.width = q.get('w') || 1440; f.height = q.get('h') || 900;
  f.onload = () => setTimeout(() => {
    const d = f.contentDocument; d.documentElement.style.scrollSnapType = 'none'; d.documentElement.style.scrollBehavior = 'auto';
    const el = q.get('id') && d.getElementById(q.get('id'));
    if (el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - (+q.get('off') || 0));
    setTimeout(() => { f.contentWindow.scrollBy(0, 1); f.contentWindow.scrollBy(0, -1); }, 400);
    if (q.get("wa")) d.querySelector(".wa__bubble").click();
  }, 1200);
  f.src = '/' + q.get('src');
</script>
