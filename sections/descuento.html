<section id="descuento" class="relative w-[1428px] overflow-hidden bg-[#2a2724]" style="height:360px">
  <style>
    #descuento .dsc-field { transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease; }
    #descuento .dsc-field:hover { background-color: #faf7f3; border-color: #e4ddd5; }
    #descuento .dsc-field:focus-within { border-color: #ff6d45; box-shadow: 0 0 0 3px rgba(255,109,69,.35); }
  </style>
  <div class="absolute top-0 left-[-6px] w-[1440px] h-[360px] flex flex-col items-start">
    <div class="flex flex-[1_0_0] gap-[64px] items-center min-h-px px-[112px] py-0 relative w-full">
      <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <img alt="" class="absolute inset-0 size-full max-w-none object-cover object-[50%_100%]" src="assets/descuento/banner.png">
      </div>
      <div class="flex flex-[1_0_0] flex-col gap-[32px] items-start min-w-px relative">
        <div class="flex flex-col gap-[24px] items-start not-italic relative shrink-0 text-white w-full [word-break:break-word]">
          <h2 class="m-0 font-['Youth:Bold'] font-normal leading-[34px] text-[30px] w-full">Un descuento extra para empezar.</h2>
          <p class="m-0 font-['K_Labil_Grotesk:50_Regular'] leading-[28px] text-[18px] w-full">Déjanos tu móvil y te enviamos por SMS un descuento para tu primer pedido.</p>
        </div>
        <form class="dsc-form flex gap-[16px] items-center relative shrink-0" novalidate>
          <label class="dsc-field bg-white border-[1.5px] border-transparent border-solid flex font-['K_Labil_Grotesk:50_Regular'] gap-[8px] items-center leading-[24px] px-[14px] h-[48px] w-[300px] rounded-[12px] shrink-0 text-[#968d82] text-[16px] whitespace-nowrap cursor-text transition-colors">
            <span class="shrink-0">+34</span>
            <input class="dsc-input flex-1 min-w-0 bg-transparent border-0 outline-none p-0 m-0 text-[16px] leading-[24px] text-[#2a2724] placeholder:text-[#968d82] font-['K_Labil_Grotesk:50_Regular']" type="tel" name="phone" inputmode="numeric" autocomplete="tel-national" maxlength="12" placeholder="Número de móvil" aria-label="Número de móvil">
          </label>
          <button type="submit" class="bg-[#f96237] border-0 flex gap-[8px] items-center justify-center px-[24px] h-[48px] rounded-[999px] shrink-0 cursor-pointer hover:brightness-110 transition">
            <span class="font-['Youth:Medium'] leading-[24px] text-white text-[16px] whitespace-nowrap">Recibe tu código por SMS</span>
          </button>
        </form>
        <p class="dsc-msg absolute left-0 bottom-[-40px] m-0 font-['Youth:Medium'] text-[16px] leading-[24px] text-white" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
<script>
(function(){
  var s=document.getElementById('descuento'); if(!s) return;
  var f=s.querySelector('.dsc-form'), i=s.querySelector('.dsc-input'), m=s.querySelector('.dsc-msg'), fld=s.querySelector('.dsc-field');
  i.addEventListener('input',function(){ fld.style.borderColor=''; m.textContent=''; });
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d=i.value.replace(/\D/g,'');
    if(d.length===9){
      m.textContent='¡Te hemos enviado tu código!'; m.style.color='#ffffff';
      fld.style.borderColor='#3cb371'; i.value='';
    }else{
      m.textContent='Introduce un número de móvil válido de 9 dígitos.'; m.style.color='#ffb199';
      fld.style.borderColor='#fa592d'; i.focus();
    }
  });
})();
</script>
</section>
