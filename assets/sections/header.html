<header id="site-header" class="sticky top-0 z-50 w-[1428px]" style="height:96px; margin-bottom:-96px">
  <style>
    #site-header .hdr-bg { position:absolute; inset:0; background:#fff; opacity:0; box-shadow:0 2px 16px rgba(42,39,36,.08); transition:opacity .25s; }
    #site-header .hdr-txt { transition:color .25s; }
    #site-header .hdr-ico { transition:filter .25s; }
    #site-header.is-scrolled .hdr-bg { opacity:1; }
    /* Al hacer scroll fuera del hero el header se compacta: 96px → 72px, contenido centrado */
    #site-header { transition: height .25s ease, margin-bottom .25s ease; }
    #site-header .hdr-item { transition: transform .25s ease; }
    #site-header.is-scrolled { height:72px !important; margin-bottom:-72px !important; }
    #site-header.is-scrolled .hdr-item { transform: translateY(-19px); }
    /* Mientras se hace scroll sobre el hero: degradado oscuro sutil para que el menú blanco tenga contraste */
    #site-header .hdr-shade { position:absolute; left:0; right:0; top:0; height:150px; pointer-events:none; opacity:0; transition:opacity .3s ease;
      background:linear-gradient(180deg, rgba(24,20,16,.55) 0%, rgba(24,20,16,.32) 45%, rgba(24,20,16,0) 100%); }
    #site-header.is-over-hero .hdr-shade { opacity:1; }
    #site-header.is-scrolled .hdr-shade { opacity:0; }
    #site-header.is-scrolled .hdr-txt { color:#2a2724; }
    #site-header.is-scrolled .hdr-ico { filter:brightness(0) opacity(.85); }
  </style>

      <button type="button" class="lang-trigger flex items-center gap-[6px] h-full p-0 m-0 border-0 bg-transparent hover:opacity-75" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-menu" aria-label="Idioma: Castellano">
        <span class="lang-code block font-['K_Labil_Grotesk:50_Regular'] leading-[1.14] text-[15.879px] hdr-txt text-white whitespace-nowrap">ES</span>

      </button>
      <div id="lang-menu" class="lang-menu" role="menu" aria-label="Idioma" hidden>

      <span class="font-['Youth:Medium'] leading-[24px] text-[16px] text-white whitespace-nowrap">Calcular mi precio</span>

  <style>
    /* Menú de idioma: mismos tokens que el SelectMenu (Nuxt UI → paleta Dogfy) */
    #site-header .lang-chevron { transition: transform .2s; }
    #site-header .lang[data-state=open] .lang-chevron { transform: rotate(180deg); }
    #site-header .lang-menu { position:absolute; top:calc(100% + 14px); right:-12px; z-index:60; width:220px; padding:4px; background:#fff; border-radius:6px; box-shadow:0 0 0 1px #ebe4da, 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); transform-origin:top right; font-family:'K Labil Grotesk',system-ui,sans-serif; isolation:isolate; }
    #site-header .lang-menu[data-state=open] { animation: nui-scale-in .1s ease-out; }
    #site-header .lang-menu[data-state=closed] { animation: nui-scale-out .1s ease-in forwards; }
    #site-header .lang-item { position:relative; display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:0; background:transparent; font:inherit; font-size:18px; line-height:28px; font-weight:400; color:#565049; text-align:left; cursor:pointer; outline:0; }
    #site-header .lang-item::before { content:""; position:absolute; inset:1px; z-index:-1; border-radius:6px; transition:background-color .15s; }
    #site-header .lang-item:hover, #site-header .lang-item:focus-visible { color:#2a2724; }
    #site-header .lang-item:hover::before, #site-header .lang-item:focus-visible::before { background:#f6f1ec; }
    #site-header .lang-item[aria-checked=true] { color:#2a2724; }
    #site-header .lang-flag { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; width:24px; font-size:20px; line-height:1; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; }
    #site-header .lang-flag svg { width:22px; height:auto; border-radius:2px; }
    #site-header .lang-label { flex:1; }
    #site-header .lang-check { flex-shrink:0; width:24px; height:24px; color:#ff6d45; opacity:0; }
    #site-header .lang-item[aria-checked=true] .lang-check { opacity:1; }
    @keyframes nui-scale-in { from { opacity:0; transform:scale(.95) } to { opacity:1; transform:scale(1) } }
    @keyframes nui-scale-out { from { opacity:1; transform:scale(1) } to { opacity:0; transform:scale(.95) } }
  </style>
  <script>
    (function () {
      var root = document.querySelector('#site-header .lang');
      var trigger = root.querySelector('.lang-trigger');
      var menu = root.querySelector('.lang-menu');
      var code = root.querySelector('.lang-code');
      var items = Array.prototype.slice.call(menu.querySelectorAll('.lang-item'));
      function isOpen() { return root.dataset.state === 'open'; }
      function open(focusIdx) {
        menu.hidden = false;
        menu.dataset.state = 'open';
        root.dataset.state = 'open';
        trigger.setAttribute('aria-expanded', 'true');
        var i = focusIdx != null ? focusIdx : Math.max(0, items.findIndex(function (it) { return it.getAttribute('aria-checked') === 'true'; }));
        items[i].focus({ preventScroll: true });
      }
      function close(refocus) {
        if (!isOpen()) return;
        menu.dataset.state = 'closed';
        root.dataset.state = 'closed';
        trigger.setAttribute('aria-expanded', 'false');
        setTimeout(function () { if (menu.dataset.state === 'closed') menu.hidden = true; }, 100);
        if (refocus) trigger.focus({ preventScroll: true });
      }
      function choose(it) {
        items.forEach(function (x) { x.setAttribute('aria-checked', x === it ? 'true' : 'false'); });
        code.textContent = it.dataset.code;
        trigger.setAttribute('aria-label', 'Idioma: ' + it.dataset.name);
        document.documentElement.lang = it.dataset.lang;
        close(true);
      }
      items.forEach(function (it) { if (!it.hasAttribute('aria-checked')) it.setAttribute('aria-checked', 'false'); it.tabIndex = -1; it.addEventListener('click', function () { choose(it); }); });
      trigger.addEventListener('click', function () { isOpen() ? close(true) : open(); });
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(e.key === 'ArrowUp' ? items.length - 1 : 0); }
      });
      menu.addEventListener('keydown', function (e) {
        var i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
        else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
        else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
        else if (e.key === 'Escape') { e.preventDefault(); close(true); }
        else if (e.key === 'Tab') { close(false); }
      });
      items.forEach(function (it) { it.addEventListener('mousemove', function () { it.focus({ preventScroll: true }); }); });
      document.addEventListener('mousedown', function (e) { if (isOpen() && !root.contains(e.target)) close(false); });
    })();
  </script>
  <script>
    (function () {
      var h = document.getElementById('site-header');
      // El header pasa a blanco solo cuando el hero ya ha quedado por detrás de él
      var hero = null; // el hero va después del header en el DOM: se busca al hacer scroll
      function onScroll() {
        hero = hero || document.getElementById('hero');
        if (!hero) return;
        // Umbral fijo (alto del header sin compactar) para que no parpadee al cambiar de 96 a 72px
        var zoom = parseFloat(document.getElementById('canvas').style.zoom) || 1;
        var past = hero.getBoundingClientRect().bottom <= 96 * zoom;
        h.classList.toggle('is-scrolled', past);
        h.classList.toggle('is-over-hero', !past && window.scrollY > 8);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      document.addEventListener('DOMContentLoaded', onScroll);
      // Logo: vuelve al principio de la landing y limpia el hash de la URL
      h.querySelector('.hdr-logo').addEventListener('click', function (e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        history.replaceState(null, '', location.pathname + location.search);
      });
    })();
  </script>
</header>
