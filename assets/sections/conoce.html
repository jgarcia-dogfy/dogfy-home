  <!-- Group 274: elemento decorativo lateral -->
  <script>
    // Sello FEDIAF: repite el giro del hover cada vez que entra en pantalla al hacer scroll
    (function () {
      var el = document.querySelector("#conoce .cn-sticker");
      if (!el || !("IntersectionObserver" in window)) return;
      el.addEventListener("animationend", function () { el.classList.remove("is-spinning"); });
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) el.classList.add("is-spinning"); });
      }, { threshold: 0.6 }).observe(el);
    })();
  </script>
