<header id="m-header" class="sticky top-0 z-50 w-full h-[64px] md:h-[72px] mb-[-64px] md:mb-[-72px]">
  <style>
    #m-header .mh-bg { position:absolute; inset:0; background:#fff; opacity:0; box-shadow:0 2px 16px rgba(42,39,36,.08); transition:opacity .25s; }
    #m-header .mh-shade { position:absolute; left:0; right:0; top:0; height:120px; pointer-events:none; opacity:0; transition:opacity .3s ease;
      background:linear-gradient(180deg, rgba(24,20,16,.55) 0%, rgba(24,20,16,.3) 45%, rgba(24,20,16,0) 100%); }
    #m-header.is-over-hero .mh-shade { opacity:1; }
    #m-header.is-scrolled .mh-bg { opacity:1; }
    #m-header.is-scrolled .mh-shade { opacity:0; }
    /* Como en escritorio: al salir del hero el header se compacta (64→56px; tablet 72→60px) */
    #m-header { transition:height .25s ease, margin-bottom .25s ease; }
    #m-header.is-scrolled { height:56px !important; margin-bottom:-56px !important; }
    @media (min-width:768px) { #m-header.is-scrolled { height:60px !important; margin-bottom:-60px !important; } }
    #m-header .mh-logo { transition:opacity .2s, transform .25s ease; transform-origin:left center; }
    #m-header.is-scrolled .mh-bar .mh-logo { transform:scale(.9); }
    #m-header .mh-burger span { background:#fff; transition:background-color .25s; }
    #m-header.is-scrolled .mh-burger span { background:#2a2724; }

    /* Menú a pantalla completa */
    #m-header .mh-menu { position:fixed; inset:0; z-index:70; display:flex; flex-direction:column; background:#fff; overflow-y:auto; overscroll-behavior:contain;
      opacity:0; transform:translateY(-12px); transition:opacity .25s ease, transform .3s cubic-bezier(.2,.8,.2,1); visibility:hidden; }
    #m-header .mh-menu[data-state=open] { opacity:1; transform:none; visibility:visible; }
    #m-header .mh-menu[data-state=closed] { transition:opacity .2s ease, transform .2s ease, visibility 0s linear .2s; }
    #m-header .mh-nav a { opacity:0; transform:translateY(8px); transition:opacity .3s ease, transform .3s ease, color .15s; }
    #m-header .mh-menu[data-state=open] .mh-nav a { opacity:1; transform:none; }
    #m-header .mh-menu[data-state=open] .mh-nav a:nth-child(1) { transition-delay:.04s }
    #m-header .mh-menu[data-state=open] .mh-nav a:nth-child(2) { transition-delay:.08s }
    #m-header .mh-menu[data-state=open] .mh-nav a:nth-child(3) { transition-delay:.12s }
    #m-header .mh-menu[data-state=open] .mh-nav a:nth-child(4) { transition-delay:.16s }
    #m-header .mh-menu[data-state=open] .mh-nav a:nth-child(5) { transition-delay:.20s }
    #m-header .mh-menu[data-state=open] .mh-nav a:nth-child(6) { transition-delay:.24s }
    #m-header .mh-nav a:hover, #m-header .mh-nav a:focus-visible { color:#fa592d; }

    /* Selector de idioma (lista desplegable en línea, tokens del SelectMenu Nuxt UI) */
    #m-header .mh-lang-trigger .mh-lang-chev { transition:transform .2s; }
    #m-header .mh-lang-trigger[aria-expanded=true] .mh-lang-chev { transform:rotate(180deg); }
    #m-header .mh-lang-list { margin-top:8px; padding:4px; border-radius:6px; box-shadow:0 0 0 1px #ebe4da; isolation:isolate; }
    #m-header .mh-lang-list:not([hidden]) { animation:mh-scale-in .12s ease-out; transform-origin:top center; }
    #m-header .lang-item { position:relative; display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:0; background:transparent; font-family:'K_Labil_Grotesk:50_Regular','K Labil Grotesk',system-ui,sans-serif; font-size:16px; line-height:24px; color:#565049; text-align:left; cursor:pointer; outline:0; }
    #m-header .lang-item::before { content:""; position:absolute; inset:1px; z-index:-1; border-radius:6px; transition:background-color .15s; }
    #m-header .lang-item:hover, #m-header .lang-item:focus-visible, #m-header .lang-item[aria-checked=true] { color:#2a2724; }
    #m-header .lang-item:hover::before, #m-header .lang-item:focus-visible::before { background:#f6f1ec; }
    #m-header .lang-flag { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; width:24px; font-size:20px; line-height:1; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; }
    #m-header .lang-flag svg { width:22px; height:auto; border-radius:2px; }
    #m-header .lang-label { flex:1; }
    #m-header .lang-check { flex-shrink:0; width:22px; height:22px; color:#ff6d45; opacity:0; }
    #m-header .lang-item[aria-checked=true] .lang-check { opacity:1; }
    @keyframes mh-scale-in { from { opacity:0; transform:scale(.97) } to { opacity:1; transform:scale(1) } }
    @media (prefers-reduced-motion: reduce) {
      #m-header, #m-header .mh-logo, #m-header .mh-menu, #m-header .mh-nav a, #m-header .mh-bg, #m-header .mh-shade { transition:none !important; transform:none !important; }
      #m-header .mh-lang-list:not([hidden]) { animation:none; }
    }
  </style>
  <div class="mh-shade"></div>

        <span class="font-['Youth:Medium'] leading-[1] text-[14px] md:text-[15px] text-white whitespace-nowrap" style="font-feature-settings:'liga' 0,'calt' 0">Calcular mi precio</span>

      <a href="#" aria-label="Dogfy Diet · Volver al inicio" class="mh-logo relative block shrink-0 w-[77.753px] h-[43.785px]">

    <div class="flex-1 flex flex-col w-full max-w-[720px] mx-auto px-[24px] md:px-[32px] pt-[16px] pb-[32px]">
      <nav class="mh-nav flex flex-col" aria-label="Principal">
        <a href="#m-como-empezar" class="py-[12px] border-b border-[#ebe4da] font-['Youth:Bold'] text-[24px] md:text-[28px] leading-[32px] text-[#2a2724] no-underline">Cómo funciona</a>
        <a href="#m-recetas" class="py-[12px] border-b border-[#ebe4da] font-['Youth:Bold'] text-[24px] md:text-[28px] leading-[32px] text-[#2a2724] no-underline">Nuestras recetas</a>

        <a href="#m-testimonios" class="py-[12px] border-b border-[#ebe4da] font-['Youth:Bold'] text-[24px] md:text-[28px] leading-[32px] text-[#2a2724] no-underline">Opiniones</a>
        <a href="#m-faq" class="py-[12px] border-b border-[#ebe4da] font-['Youth:Bold'] text-[24px] md:text-[28px] leading-[32px] text-[#2a2724] no-underline">Ayuda</a>
        <a href="#m-footer" class="py-[12px] border-b border-[#ebe4da] font-['Youth:Bold'] text-[24px] md:text-[28px] leading-[32px] text-[#2a2724] no-underline">Blog</a>
      </nav>

          <span class="relative block shrink-0 size-[22.356px]"><img alt="" class="absolute block inset-0 max-w-none size-full" style="filter:brightness(0) opacity(.85)" src="assets/hero/user.svg"></span>

          </button>

            <button type="button" role="menuitemradio" class="lang-item" data-code="ES" data-lang="es" data-name="Castellano" aria-checked="true"><span class="lang-flag">🇪🇸</span><span class="lang-label">Castellano</span><svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button type="button" role="menuitemradio" class="lang-item" data-code="FR" data-lang="fr" data-name="Français"><span class="lang-flag">🇫🇷</span><span class="lang-label">Français</span><svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button type="button" role="menuitemradio" class="lang-item" data-code="IT" data-lang="it" data-name="Italiano"><span class="lang-flag">🇮🇹</span><span class="lang-label">Italiano</span><svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button type="button" role="menuitemradio" class="lang-item" data-code="DE" data-lang="de" data-name="Deutsch"><span class="lang-flag">🇩🇪</span><span class="lang-label">Deutsch</span><svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
          </div>

      <div class="mt-auto pt-[32px] flex justify-center">
      <a href="https://dogfydiet.com/nuevo-plan?step=1" class="bg-[#f96237] flex items-center justify-center w-full md:w-[320px] h-[48px] px-[14px] py-[12px] rounded-[999px] no-underline transition hover:brightness-110">

  <script>
    (function () {
      var h = document.getElementById('m-header');
      var menu = document.getElementById('m-menu');
      var burger = h.querySelector('.mh-burger');
      var closeBtn = h.querySelector('.mh-close');
      var hero = null;

      // Estado del header: transparente sobre el hero, blanco cuando el hero ya ha pasado por detrás
      function onScroll() {
        hero = hero || document.getElementById('m-hero');
        if (!hero) return;
        // Umbral fijo (≥ alto sin compactar y ≥ scroll-padding-top de 72px) para que no parpadee al
        // cambiar de alto y para que al saltar a un ancla el header ya esté en blanco
        var past = hero.getBoundingClientRect().bottom <= 80;
        h.classList.toggle('is-scrolled', past);
        h.classList.toggle('is-over-hero', !past && window.scrollY > 8);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      document.addEventListener('DOMContentLoaded', onScroll);

      // Logo: vuelve arriba y limpia el hash
      h.querySelectorAll('.mh-logo').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          if (isOpen()) close(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          history.replaceState(null, '', location.pathname + location.search);
        });
      });

      // Menú a pantalla completa
      function isOpen() { return menu.dataset.state === 'open'; }
      function focusables() {
        return Array.prototype.filter.call(menu.querySelectorAll('a[href], button:not([disabled])'), function (el) { return el.offsetParent !== null; });
      }
      function open() {
        menu.removeAttribute('inert');
        menu.dataset.state = 'open';
        burger.setAttribute('aria-expanded', 'true');
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        setTimeout(function () { closeBtn.focus({ preventScroll: true }); }, 30);
      }
      function close(refocus) {
        if (!isOpen()) return;
        menu.dataset.state = 'closed';
        menu.setAttribute('inert', '');
        burger.setAttribute('aria-expanded', 'false');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        if (refocus) burger.focus({ preventScroll: true });
      }
      burger.addEventListener('click', open);
      closeBtn.addEventListener('click', function () { close(true); });
      menu.querySelectorAll('.mh-nav a, .mh-account').forEach(function (a) {
        a.addEventListener('click', function () { close(false); });
      });
      document.addEventListener('keydown', function (e) {
        if (!isOpen()) return;
        if (e.key === 'Escape') { e.preventDefault(); close(true); return; }
        if (e.key === 'Tab') {
          var f = focusables(); if (!f.length) return;
          var first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
      // Si se pasa a escritorio con el menú abierto, se cierra
      window.matchMedia('(min-width: 1024px)').addEventListener('change', function (m) { if (m.matches) close(false); });

      // Selector de idioma
      var trig = h.querySelector('.mh-lang-trigger');
      var list = h.querySelector('.mh-lang-list');
      var items = Array.prototype.slice.call(list.querySelectorAll('.lang-item'));
      function toggleLang(show) {
        list.hidden = !show;
        trig.setAttribute('aria-expanded', show ? 'true' : 'false');
        if (show) { var c = items.find(function (it) { return it.getAttribute('aria-checked') === 'true'; }) || items[0]; c.focus({ preventScroll: true }); }
      }
      trig.addEventListener('click', function () { toggleLang(list.hidden); });
      items.forEach(function (it) {
        if (!it.hasAttribute('aria-checked')) it.setAttribute('aria-checked', 'false');
        it.addEventListener('click', function () {
          items.forEach(function (x) { x.setAttribute('aria-checked', x === it ? 'true' : 'false'); });
          h.querySelector('.mh-lang-name').textContent = it.dataset.name;
          h.querySelector('.mh-lang-flag').innerHTML = it.querySelector('.lang-flag').innerHTML;
          document.documentElement.lang = it.dataset.lang;
          toggleLang(false);
          trig.focus({ preventScroll: true });
        });
      });
      list.addEventListener('keydown', function (e) {
        var i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      });
    })();
  </script>
</header>
