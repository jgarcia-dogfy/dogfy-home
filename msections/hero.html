  <!-- Indicador de scroll: flecha que rebota y lleva al siguiente bloque -->
  <a href="#m-como-empezar" class="m-hero-scroll absolute left-1/2 -translate-x-1/2 bottom-[12px] md:bottom-[16px] flex items-center justify-center no-underline size-[32px]" aria-label="Bajar al siguiente bloque">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </a>

  <script>
    // Contador de las métricas: sube de 0 al valor final al cargar
    (function () {
      var els = document.querySelectorAll('#m-hero .m-hero-count');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      function fmt(v, d) { return v.toFixed(d).replace('.', ',') + '%'; }
      function ease(t) { return 1 - Math.pow(1 - t, 3); }
      els.forEach(function (el) { el.style.visibility = 'hidden'; });
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { els.forEach(function (el, i) {
        el.style.visibility = '';
        var target = parseFloat(el.dataset.count), dec = +el.dataset.decimals;
        if (el.offsetWidth) el.style.minWidth = el.offsetWidth + 'px'; /* evita saltos de ancho mientras cuenta */
        el.textContent = fmt(0, dec);
        var dur = 900, delay = 100 + i * 80, start = null;
        function step(ts) {
          if (start === null) start = ts;
          var t = Math.min(1, (ts - start - delay) / dur);
          if (t < 0) { requestAnimationFrame(step); return; }
          el.textContent = fmt(target * ease(t), dec);
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }); });
    })();
  </script>
