<section id="m-descuento" class="relative w-full overflow-hidden bg-[#2a2724]">
  <style>
    #m-descuento .mdsc-field { transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease; }
    @media (hover: hover) { #m-descuento .mdsc-field:hover { background-color: #faf7f3; border-color: #e4ddd5; } }
    #m-descuento .mdsc-field:focus-within { border-color: #ff6d45; box-shadow: 0 0 0 3px rgba(255,109,69,.35); }
    @media (prefers-reduced-motion: reduce) { #m-descuento .mdsc-field, #m-descuento button { transition: none; } }
  </style>
  <img alt="" class="absolute inset-0 size-full max-w-none object-cover object-[50%_100%] pointer-events-none" src="assets/descuento/banner.png">
  <div class="relative mx-auto w-full max-w-[720px] px-[18px] md:px-0 pt-[56px] pb-[48px] md:pt-[72px] md:pb-[64px] flex flex-col gap-[24px] md:gap-[32px] items-start">
    <div class="flex flex-col gap-[16px] md:gap-[24px] items-start text-white not-italic w-full [word-break:break-word]">
      <h2 class="m-0 font-['Youth:Bold'] font-normal text-[22px] leading-[27px] md:text-[34px] md:leading-[38px] w-full">Un descuento extra para empezar.</h2>
      <p class="m-0 font-['K_Labil_Grotesk:50_Regular'] text-[16px] leading-[24px] md:text-[18px] md:leading-[28px] w-full md:max-w-[560px]">Déjanos tu móvil y te enviamos por SMS un descuento para tu primer pedido.</p>
    </div>
    <form class="mdsc-form flex flex-col md:flex-row md:items-center gap-[12px] md:gap-[16px] w-full md:w-auto" novalidate>
      <label class="mdsc-field bg-white border-[1.5px] border-transparent border-solid flex gap-[8px] items-center px-[14px] h-[48px] w-full md:w-[300px] rounded-[12px] shrink-0 cursor-text font-['K_Labil_Grotesk:50_Regular'] text-[16px] leading-[24px] text-[#968d82] whitespace-nowrap">
        <span class="shrink-0">+34</span>
        <input class="mdsc-input flex-1 min-w-0 bg-transparent border-0 outline-none p-0 m-0 text-[16px] leading-[24px] text-[#2a2724] placeholder:text-[#968d82] font-['K_Labil_Grotesk:50_Regular']" type="tel" name="phone" inputmode="numeric" autocomplete="tel-national" maxlength="12" placeholder="Número de móvil" aria-label="Número de móvil">
      </label>
      <button type="submit" class="bg-[#f96237] border-0 flex gap-[8px] items-center justify-center px-[24px] h-[48px] w-full md:w-auto rounded-[999px] shrink-0 cursor-pointer transition hover:brightness-110 active:brightness-110">
        <span class="font-['Youth:Medium'] text-[16px] leading-[24px] text-white whitespace-nowrap">Recibe tu código por SMS</span>
      </button>
    </form>
    <p class="mdsc-msg -mt-[8px] md:-mt-[16px] m-0 min-h-[24px] font-['Youth:Medium'] text-[16px] leading-[24px] text-white" role="status" aria-live="polite"></p>
  </div>
<script>
(function(){
  var s=document.getElementById('m-descuento'); if(!s) return;
  var f=s.querySelector('.mdsc-form'), i=s.querySelector('.mdsc-input'), m=s.querySelector('.mdsc-msg'), fld=s.querySelector('.mdsc-field');
  i.addEventListener('input',function(){ fld.style.borderColor=''; m.textContent=''; });
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d=i.value.replace(/\D/g,'');
    if(d.length===9){
      m.textContent='¡Te hemos enviado tu código!'; m.style.color='#ffffff';
      fld.style.borderColor='#3cb371'; i.value='';
    }else{
      m.textContent='Introduce un número de móvil válido de 9 dígitos.'; m.style.color='#ffb199';
      fld.style.borderColor='#fa592d'; i.focus();
    }
  });
})();
</script>
</section>
