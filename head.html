<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogfy Diet · Home</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  /* Las clases que genera Figma usan los nombres de estilo como familia ('Youth:Bold', ...) */
  @font-face { font-family: "Youth:Bold"; src: url(fonts/Youth-Bold.woff2) format('woff2'), url(fonts/Youth-Bold.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "Youth:Medium"; src: url(fonts/Youth-Medium.woff2) format('woff2'), url(fonts/Youth-Medium.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "Youth:Black"; src: url(fonts/Youth-Black.woff2) format('woff2'), url(fonts/Youth-Black.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "K_Labil_Grotesk:50_Regular"; src: url(fonts/KLabilGrotesk-50Regular.woff2) format('woff2'), url(fonts/KLabilGrotesk-50Regular.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "K_Labil_Grotesk:70_Bold"; src: url(fonts/KLabilGrotesk-70Bold.woff2) format('woff2'), url(fonts/KLabilGrotesk-70Bold.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "Labil_Grotesk:Regular"; src: url(fonts/KLabilGrotesk-50Regular.woff2) format('woff2'), url(fonts/KLabilGrotesk-50Regular.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "Labil_Grotesk:Bold"; src: url(fonts/KLabilGrotesk-70Bold.woff2) format('woff2'), url(fonts/KLabilGrotesk-70Bold.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "Youth"; src: url(fonts/Youth-Medium.woff2) format('woff2'), url(fonts/Youth-Medium.otf) format('opentype'); font-weight: 500; }
  @font-face { font-family: "Youth"; src: url(fonts/Youth-Bold.woff2) format('woff2'), url(fonts/Youth-Bold.otf) format('opentype'); font-weight: 700; }
  @font-face { font-family: "Youth"; src: url(fonts/Youth-Black.woff2) format('woff2'), url(fonts/Youth-Black.otf) format('opentype'); font-weight: 900; }
  @font-face { font-family: "K Labil Grotesk"; src: url(fonts/KLabilGrotesk-50Regular.woff2) format('woff2'), url(fonts/KLabilGrotesk-50Regular.otf) format('opentype'); font-weight: 400; }
  @font-face { font-family: "K Labil Grotesk"; src: url(fonts/KLabilGrotesk-70Bold.woff2) format('woff2'), url(fonts/KLabilGrotesk-70Bold.otf) format('opentype'); font-weight: 700; }
  @font-face { font-family: "K Labil Grotesk"; src: url(fonts/KLabilGrotesk-55RegularItalic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
  @font-face { font-family: "K Labil Grotesk"; src: url(fonts/KLabilGrotesk-75BoldItalic.woff2) format('woff2'); font-weight: 700; font-style: italic; }
  /* Tailwind convierte "_" en espacios dentro de valores arbitrarios */
  @font-face { font-family: "K Labil Grotesk:50 Regular"; src: url(fonts/KLabilGrotesk-50Regular.woff2) format('woff2'), url(fonts/KLabilGrotesk-50Regular.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "K Labil Grotesk:70 Bold"; src: url(fonts/KLabilGrotesk-70Bold.woff2) format('woff2'), url(fonts/KLabilGrotesk-70Bold.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "Labil Grotesk:Regular"; src: url(fonts/KLabilGrotesk-50Regular.woff2) format('woff2'), url(fonts/KLabilGrotesk-50Regular.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: "Labil Grotesk:Bold"; src: url(fonts/KLabilGrotesk-70Bold.woff2) format('woff2'), url(fonts/KLabilGrotesk-70Bold.otf) format('opentype'); font-display: swap; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fff; color: #2a2724; font-family: "K_Labil_Grotesk:50_Regular", "K Labil Grotesk", system-ui, sans-serif; overflow-x: hidden; }
  /* Lienzo de diseño: 1428px de ancho; se escala para caber en ventanas más estrechas */
  .canvas { width: 1428px; margin: 0 auto; position: relative; }
  .canvas > section, .canvas > main > section, .canvas > footer { position: relative; width: 1428px; }
  /* Scroll con imán suave: se ajusta al inicio de cada bloque (header compacto = 72px) */
  html { scroll-snap-type: y proximity; scroll-padding-top: 72px; }
  .snap { scroll-snap-align: start; }
  .snap-end { scroll-snap-align: end; }
  @media (prefers-reduced-motion: reduce) { html { scroll-snap-type: none; scroll-behavior: auto; } }
  a, button { cursor: pointer; }
  /* Foco de teclado visible sobre cualquier fondo (anillo doble blanco + negro, WCAG 2.4.7 / 2.4.13) */
  :focus-visible { outline: 3px solid #000 !important; outline-offset: 2px !important; box-shadow: 0 0 0 5px #fff !important; }
</style>
</head>
<body>
<div class="canvas hidden lg:block" id="canvas">
